<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Inline SVG favicon (a rounded indigo square) supplied as a data URI so the
      browser never issues a request for /favicon.ico, which the dev server and a
      static host answer with 404 (finding INFO-1). Keeping the icon inline adds
      no binary asset to the repository and no extra network request.
    -->
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg%20xmlns='http://www.w3.org/2000/svg'%20viewBox='0%200%2032%2032'%3E%3Crect%20width='32'%20height='32'%20rx='7'%20fill='%234f46e5'/%3E%3C/svg%3E"
    />
    <meta
      name="description"
      content="Customer UI for applying coupons and tracking an order through its CREATED, CONFIRMED, and DELIVERED lifecycle."
    />
    <title>Customer UI</title>
  </head>
  <body>
    <!-- Vite + React entry; mounts <App/> via /src/main.jsx -->
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
